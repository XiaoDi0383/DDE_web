<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ThePlan スレタイ検索">
  <title>ThePlan</title>
  <link rel="stylesheet" href="./search.css">
  <link rel="prefetch" href="./assets/P2_loading.png" as="image">
  <script src="./search.js" defer></script>
</head>
<body class="search-page">
  <main class="search-scene">
    <div class="clouds" aria-hidden="true">
      <span class="cloud cloud-green"></span>
      <span class="cloud cloud-pink"></span>
      <span class="cloud cloud-blue"></span>
      <span class="cloud cloud-yellow"></span>
    </div>

    <h1 class="brand"><img src="./assets/P1_theplan.png" width="567" height="155" alt="ThePlan"></h1>

    <nav class="home-nav" aria-label="サイトメニュー" lang="en">
      <a href="./index.html">TOP</a>
      <span aria-hidden="true"> - </span>
      <button type="button" id="open-guide" aria-haspopup="dialog">GUIDE(FAQ)</button>
    </nav>

    <form class="search-form" id="thread-search" role="search" action="./index.html">
      <label for="query" class="visually-hidden">スレッドのタイトル</label>
      <input id="query" name="q" type="search" enterkeyhint="search" autocomplete="off"
        autocapitalize="none" spellcheck="false" aria-describedby="search-status" required>
      <button type="submit">スレタイ検索</button>
      <p class="search-status" id="search-status" role="status"></p>
    </form>
  </main>

  <dialog id="guide" aria-labelledby="guide-heading">
    <h2 id="guide-heading" lang="en">GUIDE(FAQ)</h2>
    <p>探したいスレッドのタイトルを入力して、「スレタイ検索」を押してください。</p>
    <form method="dialog"><button type="submit">閉じる</button></form>
  </dialog>
</body>
</html>
